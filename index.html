<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR4 Boss Timer - Trupe Fantasma HUD</title>
<style>
:root{
  --bg-dark:#04060a;
  --glass-panel:rgba(10,16,28,.92);
  --glass-card:rgba(16,25,43,.82);
  --glass-border:rgba(255,255,255,.04);
  --neon-gold:#e5b842;
  --neon-gold-glow:rgba(229,184,66,.2);
  --neon-blue:#00d2ff;
  --neon-green:#00ff87;
  --neon-red:#ff4a4a;
  --text-main:#f3f4f6;
  --text-muted:#8ca0ba;
  --trupe-gradient:linear-gradient(135deg,#ff416c,#8a2387,#00d2ff);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg-dark);
  color:var(--text-main);
  padding:30px 20px;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,#111a2e 0%,#030508 80%);
}
header{text-align:center;margin-bottom:35px}
.team-badge{
  display:inline-block;margin-bottom:4px;
  font-weight:800;font-size:1rem;letter-spacing:4px;text-transform:uppercase;
  background:var(--trupe-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
h1{
  font-size:2.8rem;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(135deg,#fff 40%,var(--neon-gold) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
header p{color:var(--text-muted);margin-top:8px;font-size:.9rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}

.top-navigation{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;max-width:1280px;margin-bottom:30px;padding:14px 24px;
  background:var(--glass-panel);border:1px solid var(--glass-border);border-radius:16px;
  box-shadow:0 25px 50px rgba(0,0,0,.5);
}
.filter-tabs{display:flex;align-items:center;gap:8px}
.filter-tabs span{color:var(--neon-gold);font-size:.8rem;font-weight:800;letter-spacing:1.5px;margin-right:12px}
.tab-btn{
  background:rgba(255,255,255,.02);border:1px solid transparent;color:var(--text-muted);
  font-family:inherit;font-weight:600;font-size:.85rem;padding:8px 18px;cursor:pointer;border-radius:8px;
  transition:color .2s,background-color .2s,box-shadow .2s;
}
.tab-btn:hover{color:var(--text-main);background:rgba(255,255,255,.06)}
.tab-btn.active{color:#04060a;background:var(--neon-gold);font-weight:700;box-shadow:0 0 15px var(--neon-gold-glow)}
.search-container input{
  width:280px;padding:10px 16px;outline:none;
  background:rgba(0,0,0,.3);border:1px solid var(--glass-border);border-radius:8px;
  color:#fff;font-family:inherit;font-size:.9rem;
  transition:border-color .2s,box-shadow .2s;
}
.search-container input:focus{border-color:var(--neon-blue);box-shadow:0 0 15px rgba(0,210,255,.15)}

.main-hud{display:flex;width:100%;max-width:1280px;gap:30px}
.sidebar{width:290px;display:flex;flex-direction:column;gap:20px;flex-shrink:0}
.side-panel{
  background:var(--glass-panel);border:1px solid var(--glass-border);border-radius:16px;
  padding:22px;box-shadow:0 15px 35px rgba(0,0,0,.4);
}
.panel-title{
  display:flex;align-items:center;gap:8px;margin-bottom:18px;
  font-size:.75rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;
}
.side-brand{
  margin-left:auto;font-size:.7rem;font-weight:800;
  background:var(--trupe-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.live-panel{
  border-color:rgba(255,74,74,.12);
  background:radial-gradient(circle at 0 0,rgba(255,74,74,.05) 0%,var(--glass-panel) 100%);
}
.live-item{
  background:rgba(255,74,74,.04);border:1px solid rgba(255,74,74,.12);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;
  transition:background-color .2s,border-color .2s,transform .2s;
}
.live-item:hover{background:rgba(255,74,74,.1);border-color:var(--neon-red);transform:translateY(-2px)}
.live-title{display:flex;justify-content:space-between;font-weight:700;color:#fff;font-size:.9rem;letter-spacing:.5px}
.live-status{color:var(--neon-red);font-size:.8rem;font-weight:800;text-shadow:0 0 8px var(--neon-red);animation:pulse 1.2s infinite alternate}
.live-desc{color:var(--text-muted);font-size:.75rem;margin-top:5px}
.live-empty{color:var(--text-muted);font-size:.85rem;text-align:center;padding:5px}
@keyframes pulse{from{opacity:.5}to{opacity:1}}

.audio-btn,.clear-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;
  border:1px solid var(--glass-border);border-radius:10px;
  transition:background-color .2s,border-color .2s,color .2s;
}
.audio-btn{background:rgba(0,255,135,.05);border-color:rgba(0,255,135,.15);color:var(--neon-green)}
.audio-btn:hover{background:rgba(0,255,135,.12);border-color:var(--neon-green)}
.audio-btn.muted{background:rgba(255,74,74,.05);border-color:rgba(255,74,74,.15);color:var(--neon-red)}
.audio-btn.muted:hover{background:rgba(255,74,74,.12);border-color:var(--neon-red)}
.clear-btn{background:rgba(255,255,255,.01);color:var(--text-muted)}
.clear-btn:hover{background:rgba(255,74,74,.08);color:var(--neon-red);border-color:rgba(255,74,74,.2)}

.progress-box{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.02);border-radius:10px;padding:18px;text-align:center}
.counter{font-size:2.5rem;font-weight:800;color:#fff;letter-spacing:-1px}
.progress-box .label{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:600}

.grid-container{flex-grow:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(48%,1fr));gap:20px;align-content:flex-start}
.card{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:var(--glass-card);border:1px solid var(--glass-border);border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.card:hover{border-color:rgba(255,255,255,.12);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.card-lvl-badge{
  position:absolute;top:16px;right:20px;padding:4px 10px;border-radius:6px;
  font-size:.7rem;font-weight:800;letter-spacing:.5px;background:rgba(255,255,255,.04);color:var(--text-muted);
}
.lvl-140{border-left:3px solid #38bdf8}
.lvl-141{border-left:3px solid #4ade80}
.lvl-143{border-left:3px solid #06b6d4}
.lvl-150{border-left:3px solid #a855f7}
.lvl-155{border-left:3px solid #f43f5e}
.lvl-158{border-left:3px solid #facc15}
.card-header-area{padding:20px 20px 10px}
.card-boss-name{font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:.5px}
.card-body-flex{display:flex;align-items:center;gap:16px;padding:10px 20px 20px}
.boss-avatar{
  width:58px;height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.05);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.4);
}
.boss-info-details{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--text-muted)}
.info-row strong{color:var(--text-main);font-weight:600}
.card-footer-timer{
  padding:18px;text-align:center;cursor:pointer;
  background:rgba(4,7,13,.5);border-top:1px solid var(--glass-border);
  transition:background-color .2s;
}
.card-footer-timer:hover{background:rgba(0,0,0,.6)}
.footer-next-title{font-size:1.6rem;color:#fff;font-weight:700;letter-spacing:-.5px}
.footer-countdown{font-size:.8rem;color:var(--text-muted);margin-top:2px;font-weight:600;letter-spacing:.5px}
.card.imminent{border-color:rgba(255,74,74,.25);background:linear-gradient(180deg,var(--glass-card) 0%,rgba(255,74,74,.02) 100%)}
.card.imminent .footer-next-title{color:var(--neon-red);text-shadow:0 0 15px rgba(255,74,74,.3)}
.card.completed{opacity:.2;filter:grayscale(100%)}
.card.completed .footer-next-title{color:var(--neon-green)}

@media (max-width:950px){
  .main-hud{flex-direction:column}
  .sidebar{width:100%}
  .grid-container{grid-template-columns:1fr}
  .top-navigation{flex-direction:column;gap:15px}
  .filter-tabs{flex-wrap:wrap;justify-content:center}
}
</style>
</head>
<body>

<header>
  <div class="team-badge">Trupe Fantasma</div>
  <h1>MIR4 BOSS TIMER</h1>
  <p>Fuso Horário de Brasília (UTC-3) | Painel Operacional</p>
</header>

<div class="top-navigation">
  <div class="filter-tabs" id="tabs">
    <span>FILTRAR NÍVEL</span>
    <button class="tab-btn active" data-lvl="all">Todos</button>
    <button class="tab-btn" data-lvl="140-">140-</button>
    <button class="tab-btn" data-lvl="141+">141+</button>
    <button class="tab-btn" data-lvl="143+">143+</button>
    <button class="tab-btn" data-lvl="150+">150+</button>
    <button class="tab-btn" data-lvl="155+">155+</button>
    <button class="tab-btn" data-lvl="158+">158+</button>
  </div>
  <div class="search-container">
    <input type="text" id="bossSearch" placeholder="Procurar boss específico..." autocomplete="off">
  </div>
</div>

<div class="main-hud">
  <div class="sidebar">
    <button id="audioToggleBtn" class="audio-btn"><span>🔊</span> <span>Notificação por Voz: ON</span></button>

    <div class="side-panel live-panel">
      <div class="panel-title"><span>⚔️</span> VIVOS NO MAPA AGORA <span class="side-brand">TRUPE FANTASMA</span></div>
      <div id="liveBossesContainer"></div>
    </div>

    <div class="side-panel">
      <div class="panel-title"><span>📊</span> PROGRESSO DA SEMANA</div>
      <div class="progress-box">
        <div id="weeklyCounter" class="counter">0 / 0</div>
        <div class="label">Abates Confirmados</div>
      </div>
    </div>

    <button id="resetBtn" class="clear-btn">Resetar Concluídos da Semana</button>
  </div>

  <div class="grid-container" id="bossGrid"></div>
</div>

<script>
"use strict";
const MIN = 60000, DAY = 86400000;
const KEY = id => "mir4_boss_" + id;

const RAW = [
  ["mata","140-",3,1,"Floresta do Touro Malvado","Mata","🐂","00:00",2],
  ["touro_trovejante","140-",3,1,"1F do Templo do Touro","Touro Trovejante","🦬","01:00",2],
  ["rei_touros_malvados","140-",3,1,"Santuário do Rei dos Touros Malvados","Rei dos Touros Malvados","👑","00:00",3],
  ["velho_ermo","140-",3,8,"Círculo de Selo dos Gigantes Brancos","Velho do Ermo","🧙‍♂️","01:00",4],
  ["taehyul","141+",3,7,"Jardim de Taehyul","Taehyul","🪴","01:00",2],
  ["yiun","141+",3,7,"Construção Principal do Culto Demoniaco","Yiun","🩸","02:00",3],
  ["santidade_nefariox","141+",3,4,"Deserto de Phantasia","Santidade Inabalável Nefariox","🦂","00:00",2],
  ["kurilaica","141+",3,4,"Círculo de Selo do Suserano","Kurilaica","🦎","00:00",3],
  ["juhui","143+",3,2,"Montanha da Lúnula de Sangue","Juhui","🌙","02:30",3],
  ["faluk","143+",3,5,"Grande Muralha de Sabuk","Faluk","🧱","00:30",3],
  ["assombracao_destruidora","143+",3,5,"Templo Ilusório","Assombração Destruidora de Histórias","🔮","01:30",3],
  ["gyo_besta","150+",3,3,"Necrópole de Nefariox","Gyo da Besta","💀","02:30",6],
  ["imperador_tatu","150+",3,3,"Planície das Víboras Monstruosas","Imperador Tatu Sombrio","🐍","01:30",2],
  ["bodoo","150+",3,3,"Túmulo de Rockcut","Budu","👺","03:30",6],
  ["mara","150+",3,3,"Túmulo de Rockcut","Mara","🪨","02:30",3],
  ["asura_bicheon","150+",3,6,"Cidade Bicheon","Asura de Bicheon","⚔️","04:30",6],
  ["cheol_mokgang","150+",3,6,"Cidade Bicheon","Cheol Mokgang","🪵","00:30",2],
  ["wuihan","150+",3,6,"Bosques Fantasmas","Wuihan","👻","05:30",6],
  ["hong_yeom","150+",3,6,"Abisso da Mina Demoníaca","Hong Yeom Transformada","🔥","01:30",2],
  ["yeti","150+",3,6,"Labirinto de Bicheon","Yeti","❄️","00:30",6],
  ["jihwa","155+",1,1,"Cidade Unseo","Jihwa","🦊","02:30",3],
  ["tatu_gigante","155+",1,1,"Montanha dos Sete Vales","Tatu Gigante","🛡️","00:30",3],
  ["yaksha","155+",1,1,"Montanha dos Sete Vales","Yaksha","👹","03:30",6],
  ["bulhu","155+",1,1,"Ilha do Fogo Ardente","Bulhu","🌋","04:30",6],
  ["bolota_m1","155+",1,1,"Ilha do Fogo Ardente","Bolota Mapa 1","🗿","03:00",6],
  ["gwe_mukang","155+",1,2,"Campo de Gelo do Dragão Noveno","Gwe Mukang","🐉","05:30",6],
  ["do_maeongryong","155+",1,2,"Prisão Subterrânea","Do Maeongryong","⛓️","00:30",6],
  ["molgrash","155+",1,2,"Prisão Subterrânea","Molgrash","🧌","01:30",3],
  ["wi_gwangryeong","155+",1,2,"Palácio do Dragão Noveno","Wi Gwangryeong","⛩️","02:30",3],
  ["bolota_m2","155+",1,2,"Palácio do Dragão Noveno","Bolota Mapa 2","🔱","05:00",6],
  ["krog_158","158+",1,3,"Ruínas do Nefariox Primal","Krog","🐗","01:30",6],
  ["kelis_158","158+",1,3,"Desfiladeiro Congelado","Kelis","🦅","02:30",6],
  ["talasa_158","158+",1,3,"Desfiadeiro Congelado","Talasa","🌊","02:30",3],
  ["barkas_158","158+",1,3,"Antiga Fortaleza dos Ancestrais","Barkas","🦇","03:30",6],
  ["bargan_158","158+",1,3,"Templo das Hidras","Bargan","🐺","00:30",3],
  ["morg_158","158+",1,3,"Templo das Hidras","Morg","🕷️","04:30",6],
  ["bordo_158","158+",1,3,"Abisso de Hidra","Bordo","🐲","05:30",6]
];

const pad = n => (n < 10 ? "0" : "") + n;
const fmt = t => pad(t / 60 | 0) + ":" + pad(t % 60);

const bosses = RAW.map(([id, lvl, camada, mundo, map, boss, icon, start, step]) => {
  const [h, m] = start.split(":");
  const times = [];
  for (let t = h * 60 + +m; t < 1440; t += step * 60) times.push(t);
  return {
    id, lvl, map, boss, icon, times,
    cls: "lvl-" + parseInt(lvl),
    head: `<span class="card-lvl-badge">LVL ${lvl}</span>
<div class="card-header-area"><div class="card-boss-name">${boss.toUpperCase()}</div></div>
<div class="card-body-flex"><div class="boss-avatar">${icon}</div><div class="boss-info-details">
<div class="info-row">📍 <span>Mapa: <strong>${map}</strong></span></div>
<div class="info-row">🗺️ <span>Mundo: <strong>Camada ${camada} Mundo ${mundo}</strong></span></div>
<div class="info-row">⏰ <span>Ciclos: <strong>${times.length}/dia</strong></span></div></div></div>`
  };
});

const $ = id => document.getElementById(id);
const gridEl = $("bossGrid"), liveEl = $("liveBossesContainer"), searchEl = $("bossSearch"),
      counterEl = $("weeklyCounter"), audioBtn = $("audioToggleBtn"), tabsEl = $("tabs");
const EMPTY_LIVE = '<div class="live-empty">Nenhum chefe ativo</div>';

let tabFilter = "all", audioOn = true;
const alerted = new Set();
const done = new Set();

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const loadDone = () => { done.clear(); bosses.forEach(b => lsGet(KEY(b.id)) === "true" && done.add(b.id)); };

function voiceAlert(name) {
  if (!audioOn || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(`Atenção Trupe Fantasma, o chefe ${name} vai nascer em cinco minutos!`);
  u.lang = "pt-BR";
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

let lastSig = "", lastLive = null, lastCount = "", cdEls = [], cdTxt = [], shown = [];

function render(force) {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nowMs = (nowMin * 60 + now.getSeconds()) * 1000 + now.getMilliseconds();
  const q = searchEl.value.toLowerCase();
  let live = "";
  const rows = [];

  for (const b of bosses) {
    const isDone = done.has(b.id);
    let spawn = null;
    for (const t of b.times) if ((nowMs - t * MIN + DAY) % DAY <= 15 * MIN) spawn = t;
    if (spawn !== null && !isDone) {
      live += `<div class="live-item" data-id="${b.id}"><div class="live-title"><span>${b.boss.toUpperCase()}</span><span class="live-status">● ATIVO</span></div><div class="live-desc">Spawn: ${fmt(spawn)} • ${b.map}</div></div>`;
    }
    let nx = b.times.find(t => t > nowMin);
    if (nx === undefined) nx = b.times[0];
    let diff = nx * MIN - nowMs;
    if (diff < 0) diff += DAY;
    rows.push({ b, isDone, nx, diff });
  }
  rows.sort((a, c) => a.diff - c.diff);

  const countTxt = `${done.size} / ${bosses.length}`;
  if (countTxt !== lastCount) { counterEl.textContent = countTxt; lastCount = countTxt; }
  live = live || EMPTY_LIVE;
  if (live !== lastLive) { liveEl.innerHTML = live; lastLive = live; }

  const vis = [];
  for (const r of rows) {
    const { b } = r;
    if (tabFilter !== "all" && b.lvl !== tabFilter) continue;
    if (q && !b.boss.toLowerCase().includes(q)) continue;
    r.h = r.diff / 3600000 | 0;
    r.m = r.diff % 3600000 / 60000 | 0;
    r.s = r.diff % 60000 / 1000 | 0;
    if (!r.isDone && r.h === 0 && r.m === 5) {
      const k = b.id + "_" + r.nx;
      if (!alerted.has(k)) { voiceAlert(b.boss); alerted.add(k); }
    }
    r.st = r.isDone ? " completed" : (r.h === 0 && r.m < 5 ? " imminent" : "");
    r.cd = r.isDone ? "✓ Concluído na Semana" : `Tempo restante: ${pad(r.h)}:${pad(r.m)}:${pad(r.s)}`;
    vis.push(r);
  }

  const sig = vis.map(r => r.b.id + r.st + r.nx).join("|");
  if (force || sig !== lastSig) {
    gridEl.innerHTML = vis.map(r =>
      `<div class="card ${r.b.cls}${r.st}">${r.b.head}<div class="card-footer-timer" data-id="${r.b.id}"><div class="footer-next-title">${r.isDone ? "EM RE-RESPAWN" : "PRÓXIMO: " + fmt(r.nx)}</div><div class="footer-countdown">${r.cd}</div></div></div>`
    ).join("");
    cdEls = gridEl.getElementsByClassName("footer-countdown");
    cdTxt = vis.map(r => r.cd);
    lastSig = sig;
  } else {
    for (let i = 0; i < vis.length; i++) {
      if (cdTxt[i] !== vis[i].cd) { cdEls[i].textContent = vis[i].cd; cdTxt[i] = vis[i].cd; }
    }
  }
}

function toggleBoss(id) {
  const on = !done.has(id);
  on ? done.add(id) : done.delete(id);
  lsSet(KEY(id), on ? "true" : null);
  render(true);
}

gridEl.addEventListener("click", e => {
  const el = e.target.closest(".card-footer-timer");
  if (el) toggleBoss(el.dataset.id);
});
liveEl.addEventListener("click", e => {
  const el = e.target.closest(".live-item");
  if (el) toggleBoss(el.dataset.id);
});
tabsEl.addEventListener("click", e => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  tabsEl.querySelector(".active").classList.remove("active");
  btn.classList.add("active");
  tabFilter = btn.dataset.lvl;
  render(true);
});
searchEl.addEventListener("input", () => render(true));
audioBtn.addEventListener("click", () => {
  audioOn = !audioOn;
  audioBtn.className = audioOn ? "audio-btn" : "audio-btn muted";
  audioBtn.innerHTML = audioOn
    ? "<span>🔊</span> <span>Notificação por Voz: ON</span>"
    : "<span>🔇</span> <span>Notificação por Voz: OFF</span>";
  if (!audioOn && "speechSynthesis" in window) speechSynthesis.cancel();
});
$("resetBtn").addEventListener("click", () => {
  if (confirm("Gostaria de limpar o histórico de chefes concluídos da semana?")) {
    bosses.forEach(b => lsSet(KEY(b.id), null));
    done.clear();
    render(true);
  }
});
addEventListener("storage", () => { loadDone(); render(true); });

loadDone();
