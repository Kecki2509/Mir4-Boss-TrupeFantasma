<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR4 Boss Timer - Trupe Fantasma HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700&family=Space+Grotesk:wght=700;800&display=swap');

        :root {
            --bg-dark: #04060a;
            --bg-gradient: radial-gradient(circle at 50% 0%, #111a2e 0%, #030508 80%);
            --glass-panel: rgba(10, 16, 28, 0.75);
            --glass-card: rgba(16, 25, 43, 0.5);
            --glass-border: rgba(255, 255, 255, 0.04);
            --neon-gold: #e5b842;
            --neon-gold-glow: rgba(229, 184, 66, 0.2);
            --neon-blue: #00d2ff;
            --neon-green: #00ff87;
            --neon-red: #ff4a4a;
            --text-main: #f3f4f6;
            --text-muted: #8ca0ba;
            --trupe-gradient: linear-gradient(135deg, #ff416c, #8a2387, #00d2ff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark) var(--bg-gradient) no-repeat fixed;
            color: var(--text-main);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header .team-badge {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: var(--trupe-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            display: inline-block;
            filter: drop-shadow(0 2px 8px rgba(0,210,255,0.3));
        }

        header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 40%, var(--neon-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .top-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1280px;
            background: var(--glass-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .filter-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-tabs span {
            color: var(--neon-gold);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-right: 12px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 18px;
            cursor: pointer;
            border-radius: 8px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
        }

        .tab-btn.active {
            color: #04060a;
            background: var(--neon-gold);
            font-weight: 700;
            box-shadow: 0 0 15px var(--neon-gold-glow);
        }

        .search-container input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            width: 280px;
        }

        .search-container input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
        }

        .main-hud {
            display: flex;
            width: 100%;
            max-width: 1280px;
            gap: 30px;
        }

        .sidebar {
            width: 290px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        .side-panel {
            background: var(--glass-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title .side-brand {
            margin-left: auto;
            font-size: 0.7rem;
            background: var(--trupe-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .live-panel {
            border: 1px solid rgba(255, 74, 74, 0.12);
            background: radial-gradient(circle at 0% 0%, rgba(255, 74, 74, 0.05) 0%, var(--glass-panel) 100%);
        }

        .live-item {
            background: rgba(255, 74, 74, 0.04);
            border: 1px solid rgba(255, 74, 74, 0.12);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .live-item:hover {
            background: rgba(255, 74, 74, 0.1);
            border-color: var(--neon-red);
            transform: translateY(-2px);
        }

        .live-title {
            font-weight: 700;
            color: #fff;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .live-status {
            color: var(--neon-red);
            font-size: 0.8rem;
            font-weight: 800;
            animation: pulse-red-glow 1.2s infinite alternate;
        }

        .live-desc {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 5px;
        }

        @keyframes pulse-red-glow {
            from { opacity: 0.5; text-shadow: 0 0 0px var(--neon-red); }
            to { opacity: 1; text-shadow: 0 0 10px var(--neon-red); }
        }

        .audio-btn, .clear-btn, .map-btn {
            width: 100%;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .audio-btn {
            background: rgba(0, 255, 135, 0.05);
            border-color: rgba(0, 255, 135, 0.15);
            color: var(--neon-green);
        }
        .audio-btn:hover { background: rgba(0, 255, 135, 0.12); border-color: var(--neon-green); }

        .audio-btn.muted {
            background: rgba(255, 74, 74, 0.05);
            border-color: rgba(255, 74, 74, 0.15);
            color: var(--neon-red);
        }
        .audio-btn.muted:hover { background: rgba(255, 74, 74, 0.12); border-color: var(--neon-red); }

        .progress-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .progress-box .counter {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }

        .progress-box .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: 600;
        }

        .clear-btn { background: rgba(255,255,255,0.01); color: var(--text-muted); }
        .clear-btn:hover { background: rgba(255, 74, 74, 0.08); color: var(--neon-red); border-color: rgba(255, 74, 74, 0.2); }

        .map-btn { background: rgba(255,255,255,0.01); color: var(--text-main); }
        .map-btn:hover { background: rgba(0, 210, 255, 0.08); color: var(--neon-blue); border-color: rgba(0, 210, 255, 0.2); }

        .grid-container {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48%, 1fr));
            gap: 20px;
            align-content: flex-start;
        }

        .card {
            background: var(--glass-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .card-lvl-badge {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        
        .card.lvl-140 { border-left: 3px solid #38bdf8; }
        .card.lvl-141 { border-left: 3px solid #4ade80; }
        .card.lvl-143 { border-left: 3px solid #06b6d4; }
        .card.lvl-150 { border-left: 3px solid #a855f7; }
        .card.lvl-155 { border-left: 3px solid #f43f5e; }

        .card-header-area {
            padding: 20px 20px 10px 20px;
        }

        .card-boss-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .card-body-flex {
            display: flex;
            padding: 10px 20px 20px 20px;
            gap: 16px;
            align-items: center;
        }

        .boss-avatar {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
        }

        .boss-info-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .info-row span strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .card-footer-timer {
            padding: 18px;
            text-align: center;
            background: rgba(4, 7, 13, 0.5);
            border-top: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .card-footer-timer:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .footer-next-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .footer-countdown {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card.imminent {
            border-color: rgba(255, 74, 74, 0.25);
            background: linear-gradient(180deg, var(--glass-card) 0%, rgba(255, 74, 74, 0.02) 100%);
        }
        .card.imminent .footer-next-title {
            color: var(--neon-red);
            text-shadow: 0 0 15px rgba(255, 74, 74, 0.3);
        }

        .card.completed {
            opacity: 0.2;
            filter: grayscale(100%);
        }
        .card.completed .footer-next-title {
            color: var(--neon-green) !important;
        }

        @media (max-width: 950px) {
            .main-hud { flex-direction: column; }
            .sidebar { width: 100%; }
            .grid-container { grid-template-columns: 1fr; }
            .top-navigation { flex-direction: column; gap: 15px; }
            .filter-tabs { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>

            { id: "yaksha", lvl: "155+", class: "lvl-155", world: "L1W1", map: "Montanha dos Sete Vales", boss: "Yaksha", icon: "👹", times: ["03:30", "09:30", "15:30", "21:30"] },
            { id: "bulhu", lvl: "155+", class: "lvl-155", world: "L1W1", map: "Ilha do Fogo Ardente", boss: "Bulhu", icon: "🌋", times: ["04:30", "10:30", "16:30", "22:30"] },
            { id: "bolota_m1", lvl: "155+", class: "lvl-155", world: "L1W1", map: "Ilha do Fogo Ardente", boss: "Bolota Mapa 1", icon: "🗿", times: ["03:00", "09:00", "15:00", "21:00"] },
            { id: "gwe_mukang", lvl: "155+", class: "lvl-155", world: "L1W2", map: "Campo de Gelo do Dragão Noveno", boss: "Gwe Mukang", icon: "🐉", times: ["05:30", "11:30", "17:30", "23:30"] },
            { id: "do_maeongryong", lvl: "155+", class: "lvl-155", world: "L1W2", map: "Prisão Subterrânea", boss: "Do Maeongryong", icon: "⛓️", times: ["00:30", "06:30", "12:30", "18:30"] },
            { id: "molgrash", lvl: "155+", class: "lvl-155", world: "L1W2", map: "Prisão Subterrânea", boss: "Molgrash", icon: "🧌", times: ["01:30", "04:30", "07:30", "10:30", "13:30", "16:30", "19:30", "22:30"] },
            { id: "wi_gwangryeong", lvl: "155+", class: "lvl-155", world: "L1W2", map: "Palácio do Dragão Noveno", boss: "Wi Gwangryeong", icon: "⛩️", times: ["02:30", "05:30", "08:30", "11:30", "14:30", "17:30", "20:30", "23:30"] },
            { id: "bolota_m2", lvl: "155+", class: "lvl-155", world: "L1W2", map: "Palácio do Dragão Noveno", boss: "Bolota Mapa 2", icon: "🔱", times: ["05:00", "11:00", "17:00", "23:00"] }
        ];

        function toggleAudioGlobal() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('audioToggleBtn');
            btn.className = isAudioEnabled ? "audio-btn" : "audio-btn muted";
            btn.innerHTML = isAudioEnabled ? `<span>🔊</span> <span>Notificação por Voz: ON</span>` : `<span>🔇</span> <span>Notificação por Voz: OFF</span>`;
            if (!isAudioEnabled) window.speechSynthesis.cancel();
        }

        function playVoiceAlert(bossName) {
            if (!isAudioEnabled) return;
            const utterance = new SpeechSynthesisUtterance(`Atenção Trupe Fantasma, o chefe ${bossName} vai nascer em cinco minutos!`);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        function filterByTab(lvl, element) {
            currentTabFilter = lvl;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            updateHUD();
        }

        function toggleBossStatus(bossId) {
            const currentStatus = localStorage.getItem(`mir4_boss_${bossId}`) === 'true';
            localStorage.setItem(`mir4_boss_${bossId}`, currentStatus ? 'false' : 'true');
            updateHUD();
        }

        function resetWeeklyList() {
            if (confirm("Gostaria de limpar o histórico de chefes concluídos da semana?")) {
                bossData.forEach(item => localStorage.removeItem(`mir4_boss_${item.id}`));
                updateHUD();
            }
        }

        function updateHUD() {
            const searchInput = searchInputEl.value.toLowerCase();
            const now = new Date();
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTimeStr = `${String(currentHours).padStart(2, '0')}:${String(currentMinutes).padStart(2, '0')}`;

            let liveBossesHtml = '';
            let killedCount = 0;
            
            // Fragmento de documento para otimizar injeção de DOM em lote (Elimina gargalos de processamento)
            const fragment = document.createDocumentFragment();

            // Loop único processando ordenação e renderização simultaneamente para maior rapidez
            const processed = bossData.map(item => {
                const isCompleted = localStorage.getItem(`mir4_boss_${item.id}`) === 'true';
                if (isCompleted) killedCount++;

                let activeSpawnTime = null;
                item.times.forEach(t => {
                    const [th, tm] = t.split(':').map(Number);
                    let spawnDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), th, tm, 0);
                    if (currentHours === 0 && th === 23) spawnDate.setDate(spawnDate.getDate() - 1);

                    let ageMs = now - spawnDate;
                    if (ageMs >= 0 && ageMs <= 15 * 60 * 1000) activeSpawnTime = t;
                });

                if (activeSpawnTime && !isCompleted) {
                    liveBossesHtml += `
                        <div class="live-item" onclick="toggleBossStatus('${item.id}')">
                            <div class="live-title">
                                <span>${item.boss.toUpperCase()}</span>
                                <span class="live-status">● ATIVO</span>
                            </div>
                            <div class="live-desc">Spawn: ${activeSpawnTime} • ${item.map}</div>
                        </div>`;
                }

                let nextTimeStr = item.times.find(t => t > currentTimeStr) || item.times[0];
                const [nextH, nextM] = nextTimeStr.split(':').map(Number);
                let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), nextH, nextM, 0);
                
                let diffMs = targetDate - now;
                if (diffMs < 0) {
                    targetDate.setDate(targetDate.getDate() + 1);
                    diffMs = targetDate - now;
                }

                return { ...item, nextTimeStr, diffMs, isCompleted };
            }).sort((a, b) => a.diffMs - b.diffMs);

            weeklyCounterEl.innerText = `${killedCount} / ${bossData.length}`;
            liveContainerEl.innerHTML = liveBossesHtml || `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 5px;">Nenhum chefe ativo</div>`;

            processed.forEach(item => {
                if (currentTabFilter !== 'all' && item.lvl !== currentTabFilter) return;
                if (searchInput && !item.boss.toLowerCase().includes(searchInput)) return;

                let diffHrs = Math.floor(item.diffMs / 3600000);
                let diffMins = Math.floor((item.diffMs % 3600000) / 60000);
                let diffSecs = Math.floor((item.diffMs % 60000) / 1000);

                if (!item.isCompleted && diffHrs === 0 && diffMins === 5) {
                    const alertKey = `${item.id}_${item.nextTimeStr}`;
                    if (!activeAudioAlerts.has(alertKey)) {
                        playVoiceAlert(item.boss);
                        activeAudioAlerts.add(alertKey);
                    }
                }

                let statusClass = '';
                if (item.isCompleted) statusClass = 'completed';
                else if (diffHrs === 0 && diffMins < 5) statusClass = 'imminent';

                const card = document.createElement('div');
                card.className = `card ${item.class} ${statusClass}`;
                card.innerHTML = `
                    <span class="card-lvl-badge">LVL ${item.lvl}</span>
                    <div class="card-header-area">
                        <div class="card-boss-name">${item.boss.toUpperCase()}</div>
                    </div>
                    <div class="card-body-flex">
                        <div class="boss-avatar">${item.icon}</div>
                        <div class="boss-info-details">
                            <div class="info-row">📍 <span>Mapa: <strong>${item.map}</strong></span></div>
                            <div class="info-row">🗺️ <span>Mundo: <strong>${item.world}</strong></span></div>
                            <div class="info-row">⏰ <span>Ciclos: <strong>${item.times.length}/dia</strong></span></div>
                        </div>
                    </div>
                    <div class="card-footer-timer" onclick="toggleBossStatus('${item.id}')">
                        <div class="footer-next-title">${item.isCompleted ? 'EM RE-RESPAWN' : 'PRÓXIMO: ' + item.nextTimeStr}</div>
                        <div class="footer-countdown">${item.isCompleted ? '✓ Concluído na Semana' : 'Tempo restante: ' + String(diffHrs).padStart(2, '0') + ':' + String(diffMins).padStart(2, '0') + ':' + String(diffSecs).padStart(2, '0')}</div>
                    </div>`;
                fragment.appendChild(card);
            });

            gridEl.innerHTML = '';
            gridEl.appendChild(fragment);
        }

        updateHUD();
        setInterval(updateHUD, 1000);
    </script>
</body>
